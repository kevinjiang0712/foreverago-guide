<!-- @dsCard group="Type" viewport="700x220" name="Body face" subtitle="UI and prose. 1.85 line-height, 68–76 char measure, always left aligned." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-ui)}
.sw{display:flex;gap:1px;background:var(--border-default)}
.sw>div{flex:1;padding:12px 10px;background:var(--surface-page)}
.chip{height:44px;margin-bottom:10px;border:var(--border-width) solid var(--border-default);border-radius:var(--radius)}
.nm{font-size:12px;letter-spacing:.02em}
.hx{font-size:11px;color:var(--text-caption);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;align-items:baseline;gap:18px;padding:11px 0;border-bottom:var(--border-width) solid var(--border-soft)}
.row:last-child{border-bottom:none}
.lb{width:118px;flex:none;font-size:10px;font-weight:600;letter-spacing:var(--ls-label);color:var(--text-caption);text-transform:uppercase}
.sp{font-size:11px;color:var(--text-caption);letter-spacing:.04em;font-variant-numeric:tabular-nums;margin-left:auto}</style>
</head><body><div class="row"><span class="lb">H3 / CARD</span><span style="font-size:var(--fs-h3);font-weight:600;line-height:var(--lh-h3)">Chapter 03 · Gojo Bridge</span><span class="sp">22 / 18px · 600</span></div>
   <div class="row"><span class="lb">BODY</span><span style="font-size:var(--fs-body);line-height:var(--lh-body);flex:1;min-width:240px;max-width:52ch">Do not rush the bridge. Hug the right railing for the pickups first — the enemies respawn after the second clash.</span><span class="sp">16 / 16px · 1.85</span></div>
   <div class="row"><span class="lb">CAPTION</span><span style="font-size:var(--fs-caption);color:var(--text-secondary)">Fig. Gojo Bridge at night · official capture</span><span class="sp">14 / 14px</span></div>
   <div class="row"><span class="lb">FAMILY</span><span style="font-size:13px;color:var(--text-secondary)" data-value="--font-ui"></span></div><script src="swatch.js"></script></body></html>
